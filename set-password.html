<!doctype html>
<html lang="th" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ตั้งรหัสผ่าน | Leadership Quest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: Kanit, sans-serif; background:#070a13; color:#f8fafc; }</style>
</head>
<body class="min-h-screen grid place-items-center p-5">
  <main class="w-full max-w-md rounded-3xl border border-cyan-500/50 bg-slate-900/90 p-8 shadow-2xl">
    <div class="mx-auto mb-6 grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 text-3xl">🔐</div>
    <h1 class="text-center text-2xl font-bold">ตั้งค่า / รีเซ็ตรหัสผ่าน</h1>
    <p id="message" class="mt-3 text-center text-sm text-slate-400">กำลังตรวจสอบลิงก์เชิญ…</p>

    <form id="passwordForm" class="mt-7 hidden space-y-4">
      <div>
        <label class="mb-2 block text-sm font-medium">รหัสผ่านใหม่</label>
        <input id="password" type="password" minlength="8" required autocomplete="new-password"
          class="w-full rounded-xl border border-cyan-500/40 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-300" />
        <p class="mt-1 text-xs text-slate-500">อย่างน้อย 8 ตัวอักษร</p>
      </div>
      <div>
        <label class="mb-2 block text-sm font-medium">ยืนยันรหัสผ่าน</label>
        <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"
          class="w-full rounded-xl border border-cyan-500/40 bg-slate-950 px-4 py-3 outline-none focus:border-cyan-300" />
      </div>
      <button id="submitButton" class="w-full rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 px-4 py-3 font-bold text-slate-950 hover:from-cyan-400 hover:to-blue-500">บันทึกรหัสผ่าน</button>
    </form>

    <a id="homeLink" href="./" class="mt-6 hidden text-center text-sm text-cyan-300 underline">กลับหน้า Leadership Quest</a>
  </main>

  <script src="./supabase-admin-config.js"></script>
  <script>
    (() => {
      const message = document.getElementById("message");
      const form = document.getElementById("passwordForm");
      const homeLink = document.getElementById("homeLink");
      const setMessage = (text, className = "text-slate-400") => {
        message.textContent = text; message.className = "mt-3 text-center text-sm " + className;
      };

      const load = () => {
        if (window.supabase?.createClient) return start();
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        script.onload = start;
        script.onerror = () => setMessage("ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่", "text-rose-300");
        document.head.appendChild(script);
      };

      async function start() {
        const config = window.LEADERSHIP_QUEST_SUPABASE || {};
        if (!config.url || !config.anonKey) {
          setMessage("ระบบยังไม่ได้ตั้งค่าการเชื่อมต่อ", "text-rose-300"); return;
        }
        const client = window.supabase.createClient(config.url, config.anonKey);
        let session = null;

        const code = new URLSearchParams(location.search).get("code");
        if (code) {
          const { data, error } = await client.auth.exchangeCodeForSession(code);
          if (!error) session = data.session;
        }
        if (!session) {
          const { data } = await client.auth.getSession();
          session = data.session;
        }
        if (!session) {
          setMessage("ลิงก์เชิญไม่ถูกต้องหรือหมดอายุ กรุณาขอ invitation ใหม่จากผู้ดูแล", "text-rose-300");
          homeLink.classList.remove("hidden");
          return;
        }

        setMessage("ตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ", "text-cyan-200");
        form.classList.remove("hidden");
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const password = document.getElementById("password").value;
          const confirmation = document.getElementById("confirmPassword").value;
          if (password !== confirmation) {
            setMessage("รหัสผ่านทั้งสองช่องไม่ตรงกัน", "text-rose-300"); return;
          }
          const button = document.getElementById("submitButton");
          button.disabled = true; button.textContent = "กำลังบันทึก…";
          const { error } = await client.auth.updateUser({ password });
          if (error) {
            setMessage(error.message, "text-rose-300");
            button.disabled = false; button.textContent = "บันทึกรหัสผ่าน";
            return;
          }
          setMessage("ตั้งรหัสผ่านสำเร็จแล้ว", "text-emerald-300");
          form.classList.add("hidden");
          homeLink.classList.remove("hidden");
        });
      }
      load();
    })();
  </script>
</body>
</html>
